<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - Oybek's Calendar</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f2f4f8; color: #17202e; text-align: center; }
    main { max-width: 360px; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
    p { color: #4a5568; line-height: 1.5; margin: 0 0 1.2rem; }
    button { min-height: 48px; padding: 0 1.4rem; border: 0; border-radius: 12px; background: #2450d8; color: #fff; font-size: 1rem; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0f141c; color: #eef2f9; } p { color: #c0c9d8; } button { background: #7b9bff; color: #0b1230; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Oybek's Calendar needs an internet connection to show your family's schedule. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
